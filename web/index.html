<!doctype html>
<html lang="zh-CN" spellcheck="false" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>密记 · 加密记事本</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark" aria-hidden="true"><span class="lock-symbol"></span></span>密记</div>
    <div class="top-actions">
      <span id="sync-status" class="status" role="status" data-state="quiet">已锁定</span>
      <button id="lock" type="button" hidden>锁定</button>
    </div>
  </header>

  <main id="gate" class="gate">
    <section class="gate-card" aria-labelledby="gate-title">
      <div class="gate-mark" aria-hidden="true"><span class="lock-symbol"></span></div>
      <h1 id="gate-title">登录门禁</h1>
      <p id="gate-copy">输入门禁密码后，再用独立的加密主密码解锁笔记。</p>
      <p id="gate-notice" class="notice" role="alert" hidden></p>
      <div id="access-fields">
        <label for="access-password">门禁密码</label>
        <input id="access-password" type="password" maxlength="256" autocomplete="off">
        <button id="connect" class="primary" type="button">登录</button>
      </div>
      <div id="unlock-fields" hidden>
        <label for="password">加密主密码</label>
        <input id="password" type="password" maxlength="1024" autocomplete="off">
        <div id="confirm-field" class="confirm-field" hidden>
          <label for="confirm-password">确认加密主密码</label>
          <input id="confirm-password" type="password" maxlength="1024" autocomplete="off">
        </div>
        <button id="unlock" class="primary" type="button">解锁</button>
      </div>
    </section>
  </main>

  <main id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="笔记列表">
      <div class="sidebar-header">
        <h1>笔记</h1>
        <button id="new-note" type="button" class="small-button" aria-label="新建笔记">
          <span class="plus" aria-hidden="true"></span>新建
        </button>
      </div>
      <label class="sr-only" for="search">搜索笔记</label>
      <input id="search" type="search" placeholder="搜索笔记" autocomplete="off">
      <p id="list-empty" class="list-empty" hidden></p>
      <ul id="note-list" class="note-list"></ul>
    </aside>

    <section class="editor-pane" aria-label="笔记编辑">
      <div class="editor-toolbar">
        <div class="editor-features">
          <button id="refresh" type="button">载入云端</button>
          <button id="delete-note" class="danger" type="button" hidden>删除</button>
        </div>
        <button id="save" class="primary" type="button">加密保存</button>
      </div>
      <div class="editor-content">
        <p class="privacy-hint">离开窗口或 60 秒无操作会锁定，未保存草稿会清除。</p>
        <p id="editor-notice" class="notice" role="alert" hidden></p>
        <div id="renew-fields" class="renew-fields" hidden>
          <label for="renew-password">重新输入门禁密码</label>
          <input id="renew-password" type="password" maxlength="256" autocomplete="off">
          <button id="renew" type="button">恢复同步</button>
        </div>
        <div id="empty-editor" class="empty-editor">
          <div class="note-symbol" aria-hidden="true"></div>
          <h2>写下一条笔记</h2>
          <p>标题、正文和标签都会在浏览器里加密。</p>
          <button id="first-note" type="button">新建笔记</button>
        </div>
        <div id="editor" class="editor" hidden>
          <label class="sr-only" for="note-title">笔记标题</label>
          <input id="note-title" class="note-title" type="text" placeholder="无标题" autocomplete="off">
          <div class="note-meta">
            <label for="note-tags">标签</label>
            <input id="note-tags" type="text" placeholder="用逗号分隔标签" autocomplete="off">
          </div>
          <label class="sr-only" for="note-body">笔记正文</label>
          <textarea id="note-body" placeholder="开始记录…" autocomplete="off" spellcheck="false"></textarea>
        </div>
      </div>
    </section>
  </main>
  <dialog id="confirmation" aria-labelledby="dialog-message">
    <p id="dialog-message"></p>
    <div class="dialog-actions">
      <button id="dialog-cancel" type="button" autofocus>取消</button>
      <button id="dialog-confirm" type="button">确认</button>
    </div>
  </dialog>
</body>
</html>
